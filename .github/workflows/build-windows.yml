name: Build Windows

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Get version
        id: version
        run: |
          if ("${{ github.ref }}" -match "refs/tags/v(.*)") {
            echo "VERSION=$matches[1]" >> $env:GITHUB_OUTPUT
          } else {
            echo "VERSION=latest" >> $env:GITHUB_OUTPUT
          }

      - name: Package Windows application
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $distDir = "dist"
          New-Item -ItemType Directory -Path $distDir -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$distDir\FingerLike-Windows-$version.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerLike-Windows-${{ steps.version.outputs.VERSION }}
          path: dist/*.zip
          retention-days: 30

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
