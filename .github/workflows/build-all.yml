name: Build All Platforms

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Get version
        id: version
        run: |
          if ("${{ github.ref }}" -match "refs/tags/v(.*)") {
            echo "VERSION=$matches[1]" >> $env:GITHUB_OUTPUT
          } else {
            $commitHash = git rev-parse --short HEAD
            echo "VERSION=latest-$commitHash" >> $env:GITHUB_OUTPUT
          }

      - name: Package Windows application
        run: |
          $distDir = "dist"
          New-Item -ItemType Directory -Path $distDir -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$distDir\FingerLike-Windows-${{ steps.version.outputs.VERSION }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerLike-Windows
          path: dist/*.zip
          retention-days: 30

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build macOS app
        run: flutter build macos --release

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v(.*) ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            commit_hash=$(git rev-parse --short HEAD)
            echo "VERSION=latest-$commit_hash" >> $GITHUB_OUTPUT
          fi

      - name: Create macOS archive
        run: |
          dist_dir="dist"
          mkdir -p "$dist_dir"
          app_path="build/macos/Build/Products/Release/FingerLike.app"

          if [ -d "$app_path" ]; then
            cd "$app_path/.."
            zip -r "../../../$dist_dir/FingerLike-macOS-${{ steps.version.outputs.VERSION }}.zip" "FingerLike.app"
            cd "../../../"
          else
            echo "Error: FingerLike.app not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerLike-macOS
          path: dist/*.zip
          retention-days: 30

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
